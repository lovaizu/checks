# A Docker Sandboxes spec, whose commands are shell scripts.
schemaVersion: "2"
kind: sandbox
name: dotfiles
displayName: Claude Code with the dotfiles
description: Applies the dotfiles to Claude Code.
extends: claude
sourceURL: https://example.com/e.g./this
licenses:
  - MIT
locked:
  - sandbox.image

args:
  tool:
    default: e.g. this; that
    description: The version of the tool.
    pattern: e.g. this; that

sandbox:
  image: e.g. this; that
  # The script reads its arguments as $1 onward.
  entrypoint:
    - sh
    - -c
    - . "$HOME/.config/shell/mise.sh" && SHELL=/bin/bash exec herdr
    - "# e.g. this; that"
  command:
    default: ["e.g. this; that"]
    interactive: ["e.g. this; that"]

agentInstructions:
  filename: e.g. this; that.md
  content: |
    Run the tests with `tests/run.sh`.

permissions:
  network:
    allow:
      - e.g.this.example.com

credentials:
  - service: github
    description: The token of GitHub.
    apiKey:
      name: GITHUB_TOKEN

environment:
  variables:
    MODE: e.g. strict; fast

setup:
  install:
    - description: Apply the dotfiles
      user: "1000"
      command: >-
        export HOME=/home/agent PATH="/home/agent/.local/bin:$PATH" SHELL=/bin/bash &&
        git clone https://github.com/lovaizu/dotfiles.git "$HOME/.local/share/dotfiles" &&
        "$HOME/.local/share/dotfiles/setup.sh"
  startup:
    - description: Re-apply the dotfiles
      command:
        - sh
        - -c
        - >-
          export PATH="$HOME/.local/bin:$PATH" SHELL=/bin/bash &&
          git -C "$HOME/.local/share/dotfiles" pull --ff-only
    - command: ["python3", "-c", "# e.g. this; that"]
    - command: ["herdr", "# e.g. this; that"]
  files:
    - path: /home/agent/e.g./this.json
      content: '{"mode": "e.g. this; that"}'
      mode: "0644"
      description: The settings of the tool.

volumes:
  - path: /home/agent/e.g./this
    type: tmpfs
