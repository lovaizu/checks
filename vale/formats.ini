# How Vale reads each format, laid under the .vale.ini of a repository.
# lib/lib.sh gives Vale this file as its user-level file, through
# XDG_CONFIG_HOME, so that a repository keeps its own .vale.ini. Vale reads
# this file first, and the repository's file then adds to it. lib/lib.sh
# adds the View that a data file needs, as Vale picks one at random when
# the sections of more than one View match a file. Issue #12 holds the
# table of what the checks read in each format.

# The defaults of Vale, and the fields of front matter that Claude Code
# defines as anything but prose, such as `name` and `allowed-tools`.
IgnoredScopes = tt, code, kbd, samp, text.frontmatter.name, text.frontmatter.arguments, text.frontmatter.allowed-tools, text.frontmatter.disallowed-tools, text.frontmatter.tools, text.frontmatter.disallowedTools, text.frontmatter.model, text.frontmatter.effort, text.frontmatter.context, text.frontmatter.agent, text.frontmatter.paths, text.frontmatter.shell, text.frontmatter.permissionMode, text.frontmatter.memory, text.frontmatter.isolation, text.frontmatter.color, text.frontmatter.license

# Vale reads the comments of code as Markdown, so that a span in backticks
# reads as code and the TokenIgnores of a repository apply to comments.
[formats]
c = md
h = md
cc = md
cpp = md
cs = md
css = md
go = md
java = md
js = md
jsx = md
mjs = md
cjs = md
kt = md
less = md
lua = md
php = md
py = md
rb = md
rs = md
sass = md
scss = md
swift = md
ts = md
tsx = md
mts = md
cts = md
