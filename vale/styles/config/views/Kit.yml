# The display name of a Docker Sandboxes spec, its descriptions, and its
# agent instructions. Vale reads its comments too, and lib/lib.sh reads
# each command that runs in a shell as a shell script. The other values,
# such as names, images, paths, hosts, users and the content of files,
# aren't prose.
engine: dasel
scopes:
  - expr: displayName?
  - expr: description?
    type: md
  - expr: args?.all().description?
    type: md
  - expr: credentials?.all().description?
    type: md
  - expr: setup?.install?.all().description?
    type: md
  - expr: setup?.startup?.all().description?
    type: md
  - expr: setup?.files?.all().description?
    type: md
  - expr: agentInstructions?.content?
    type: md
