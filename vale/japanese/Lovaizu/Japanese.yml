# Not a style rule. Each match is a run of Japanese text in the prose that
# Vale reads from a file, such as a code comment, from its first Japanese
# letter to the end of the line. lib/lib.sh gives these runs to lint.py,
# which can read only Markdown and plain text.
extends: existence
message: "%s"
level: suggestion
nonword: true
tokens:
  - '[\p{Han}\p{Hiragana}\p{Katakana}][^\n]*'
