# Not a style rule. Each match is a line of the prose that Vale reads from a
# file, such as a code comment, from its first word to the end of the line.
# lib/lib.sh writes these lines into a Markdown file, which Vale and lint.py
# then read as they read Markdown, with the .vale.ini of the repository. A
# line with no word, such as a rule of dashes, has no prose to read.
extends: existence
message: "%s"
level: suggestion
nonword: true
tokens:
  - '\S*[\p{L}\p{N}][^\n]*'
