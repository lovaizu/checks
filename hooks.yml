# The checks that a repository gets when its lefthook.yml names this
# repository in remotes, with configs: [hooks.yml]. A job runs in the root
# of that repository, and its script comes from .lefthook/ of this one.
# Which files hold English and which hold Japanese is the repository's
# case, so neither job has a glob: the repository gives each job its files
# with glob and exclude of a job of the same name in its lefthook.yml.
pre-commit:
  jobs:
    - name: english
      script: prose.sh
      runner: bash
      args: "english {staged_files}"
    - name: japanese
      script: prose.sh
      runner: bash
      args: "japanese {staged_files}"
