# The checks that a repository gets when its lefthook.yml names this
# repository in remotes, with configs: [hooks.yml]. A job runs in the root
# of that repository, and its script comes from .lefthook/ of this one.
# The job has no glob, so that the repository chooses the files to check,
# with glob and exclude of a job of the same name in its lefthook.yml.
pre-commit:
  jobs:
    - name: prose
      script: prose.sh
      runner: bash
      args: "{staged_files}"
